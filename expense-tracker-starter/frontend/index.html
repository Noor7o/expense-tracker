<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Expense Tracker</span>
      <button type="button" id="theme-toggle" class="btn btn-outline-light btn-sm">Dark mode</button>
    </div>
  </nav>

  <div id="alert-container" class="container mt-3"></div>

  <div id="spinner" class="text-center my-3 d-none">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div class="container my-4">
    <div class="summary-grid text-center">

      <div class="card p-3 shadow-sm rounded-4">
        <h6 class="text-muted">Total</h6>
        <h3 id="total-amount">$0.00</h3>
      </div>

      <div class="card p-3 shadow-sm rounded-4">
        <h6 class="text-muted">Number of expenses</h6>
        <h3 id="total-count">0</h3>
      </div>

      <div class="card p-3 shadow-sm rounded-4">
        <h6 class="text-muted">Highest expense</h6>
        <h3 id="highest-expense">$0.00</h3>
      </div>

    </div>
  </div>

  <div class="container my-4">
    <div class="card p-4 shadow-sm rounded-4">
      <h4 class="mb-3" id="form-title">Add expense</h4>
      <form class="row g-3" novalidate>
        <div class="col-md-3 mb-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" class="form-control" placeholder="lunch" id="title" required>
          <div class="invalid-feedback">Title is required.</div>
        </div>
        <div class="col-md-3 mb-3">
          <label for="amount" class="form-label">Amount</label>
          <input type="number" step="0.01" class="form-control" id="amount" required placeholder="4.50">
          <div class="invalid-feedback">Enter an amount greater than 0.</div>
        </div>
        <div class="col-md-3 mb-3">
          <label for="category" class="form-label">Category</label>
          <select required id="category" class="form-select">
            <option value="" selected disabled>Choose...</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
          </select>
          <div class="invalid-feedback">Choose a category.</div>
        </div>
        <div class="col-md-3 mb-3">
          <label for="date" class="form-label">Date</label>
          <input type="date" required class="form-control" id="date">
          <div class="invalid-feedback">Date is required.</div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary" id="submit-btn">Add expense</button>
        </div>
      </form>
    </div>
  </div>

  <div class="container my-4">
    <div class="card p-3 shadow-sm rounded-4">
      <div class="table-toolbar mb-3 px-2">
        <h4 class="mb-0">Expenses</h4>
        <div class="d-flex flex-wrap gap-2">
          <input type="search" id="search-input" class="form-control w-auto" placeholder="Search by title">
          <label for="filter-category" class="visually-hidden">Category</label>
          <select id="filter-category" class="form-select w-auto">
            <option value="All" selected>All</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
          </select>
          <button type="button" id="export-csv" class="btn btn-outline-success">Export CSV</button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th data-sort="title" data-label="Title">Title</th>
              <th data-sort="amount" data-label="Amount">Amount</th>
              <th data-sort="category" data-label="Category">Category</th>
              <th data-sort="date" data-label="Date">Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="expense-table-body">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="container my-4">
    <div class="card p-4 shadow-sm rounded-4">
      <h4 class="mb-3">Spending by category</h4>
      <div class="chart-wrapper">
        <canvas id="category-chart"></canvas>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
